function setMission(mid){s.mission=mid;s.topic=getM(mid).topics.find(allowed)?.id||getM(mid).topics[0].id;nav('practice');save()}
function setTopic(id){s.topic=id;s.mission=groupForTopic(id);s.flashIndex=0;s.flashFlip=false;save();render()}
function practice(){let m=getM(s.mission),t=currentTopic();let modes=[['choose','👀 Herkennen','Frans lezen en betekenis kiezen'],['reverse','🇫🇷 Frans kiezen','Nederlands lezen en Frans kiezen'],['listen','👂 Luisteren','Luister en kies het Franse woord'],['type','✍️ Schrijven','Schrijf het Frans zelf'],['sentence','🧩 Zinnen bouwen','Zet losse woorden in de juiste volgorde']];return panel(`<h2>🎮 Oefenen</h2><p class="muted">Begin gerust met herkennen. Schrijven kun je daarna oefenen.</p><div class="controls">${DATA.map(mm=>`<button class="btn ${mm.id===m.id?'primary':''}" onclick="setMission('${mm.id}')">${esc(mm.title)}</button>`).join('')}</div><h3 class="section-title">1. Kies een onderwerp</h3><div class="grid">${m.topics.map(x=>`<button class="tile ${x.id===t.id?'on':''}" ${allowed(x)?`onclick="setTopic('${x.id}')"`:'disabled'}><b>${esc(x.name)}</b><div class="small muted">${x.items.length} woorden of zinnen · ${allowed(x)?'open':'🔒 nog niet gezien'}</div></button>`).join('')}</div><div class="divider"></div><h3>2. Kies hoe je oefent</h3><div class="grid">${modes.map(v=>`<button class="tile ${s.mode===v[0]?'on':''}" onclick="selectMode('${v[0]}')"><b>${v[1]}</b><div class="small muted">${v[2]}</div></button>`).join('')}</div><div class="divider"></div><div class="controls"><label for="count">Aantal vragen:</label><select id="count" style="width:auto" onchange="s.size=Number(this.value);save()">${[5,8,10,15].map(x=>`<option ${s.size===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn primary" ${allowed(t)?'':'disabled'} onclick="beginWordQuiz()">Start mijn oefening →</button></div><p class="small muted">💡 Je kunt een hint vragen, een woord beluisteren en na een fout rustig opnieuw proberen.</p>`)}
function selectMode(x){s.mode=x;render()}
function buildItemQueue(){let t=currentTopic();let ar=t.items.map((x,i)=>({kind:'word',id:t.id+':'+i,fr:x[0],nl:x[1],tid:t.id}));ar=shuffle(ar);if(s.reviewErrors)ar.sort((a,b)=>{let A=s.mastery[a.id]||{right:0,wrong:0},B=s.mastery[b.id]||{right:0,wrong:0};return (B.wrong-B.right)-(A.wrong-A.right)});return ar.slice(0,Math.min(s.size,ar.length))}
function beginWordQuiz(){let m=getM(s.mission);if(s.mode==='sentence'){s.queue=shuffle((SENTENCES[m.id]||[]).map((x,i)=>({kind:'sentence',id:m.id+':sentence:'+i,nl:x[0],fr:x[1]}))).slice(0,s.size)}else{s.queue=buildItemQueue()}initQuiz()}
function openReview(){let weak=allItems().filter(x=>s.mastery[x.id]?.wrong>0&&s.mastery[x.id].wrong>=s.mastery[x.id].right);if(!weak.length){s.page='progress';render();return}s.mode='choose';s.queue=shuffle(weak).slice(0,Math.min(s.size,weak.length)).map(x=>({...x,kind:'word'}));initQuiz()}
function startGrammar(){let mid=s.mission;let pool=GRAMMAR[mid]||[];let activePool=mid==='m4'?pool.filter(x=>s.grammarM4All||!['Bijvoeglijke naamwoorden','Aanwijzende woorden','Avoir (hebben)','Werkwoorden op -ER'].includes(x.topic)):pool;if(!activePool.length){alert('De grammatica van Mission 4 staat nog niet vrijgegeven. Dit kun je in de Ouderhoek veranderen.');return}s.queue=shuffle(activePool.map((q,i)=>({kind:'grammar',id:mid+':grammar:'+i,...q}))).slice(0,s.size);initQuiz()}
function initQuiz(){s.idx=0;s.checked=false;s.chosen=null;s.wrongOnce=false;s.attempts=0;s.corrects=0;s.hintShown=false;s.placed=[];s.lastAnswer='';s.exercise='quiz';s.page='quiz';prepareQuestion();render()}
function prepareQuestion(){let q=s.queue[s.idx];if(!q)return;s.chosen=null;s.checked=false;s.hintShown=false;s.wrongOnce=false;s.lastAnswer='';s.placed=[];if(q.kind==='grammar'){s.options=shuffle(q.options)}else if(q.kind==='sentence'){s.wordBank=shuffle(q.fr.replace(/[.?!]/g,'').split(/\s+/).map((v,i)=>({id:i,v})));s.options=[]}else{let t=getT(q.tid);let direction=s.mode==='reverse'||s.mode==='listen'?'fr':'nl';let target=q[direction];let choices=t.items.map(v=>direction==='fr'?v[0]:v[1]).filter(x=>norm(x)!==norm(target));s.options=shuffle([target,...shuffle([...new Set(choices)]).slice(0,3)])}}
function quiz(){if(s.idx>=s.queue.length)return done();let q=s.queue[s.idx],type=q.kind;let title=type==='grammar'?'📗 Kies het juiste antwoord':type==='sentence'?'🧩 Maak de Franse zin':s.mode==='type'?'✍️ Schrijf in het Frans':s.mode==='listen'?'👂 Luister goed':s.mode==='reverse'?'🇫🇷 Kies het Frans':'👀 Wat betekent dit?';let prompt=type==='grammar'?q.q:type==='sentence'?q.nl:s.mode==='type'||s.mode==='reverse'?q.nl:s.mode==='listen'?'Luister naar het woord en kies het juiste Frans.':q.fr;let answerBlock='';if(type==='sentence'){let available=s.wordBank.filter(x=>!s.placed.includes(x.id));answerBlock=`<div class="small muted">Tik op de woorden in de goede volgorde:</div><div class="chips" aria-label="Gemaakte zin">${s.placed.map((id,i)=>`<button class="chip done" onclick="removePlaced(${i})">${esc(s.wordBank.find(x=>x.id===id).v)} ×</button>`).join('')||'<span class="muted">Jouw zin verschijnt hier...</span>'}</div><div class="chips">${available.map(x=>`<button class="chip" onclick="addPlaced(${x.id})" ${s.checked?'disabled':''}>${esc(x.v)}</button>`).join('')}</div>`}else if(type==='word'&&s.mode==='type'){answerBlock=`<div class="fields"><label for="answer">Typ het Franse woord of de zin</label><input id="answer" type="text" placeholder="Schrijf hier je antwoord" autocomplete="off" autocapitalize="off" spellcheck="false" value="${esc(s.lastAnswer)}" ${s.checked?'disabled':''} onkeydown="if(event.key==='Enter')checkAnswer()" oninput="s.lastAnswer=this.value"></div>`}else{answerBlock=`<div class="answers">${s.options.map((v,i)=>{let val=type==='grammar'?q.a:(s.mode==='reverse'||s.mode==='listen'?q.fr:q.nl);return `<button class="answer ${s.chosen===i?'selected':''} ${s.checked&&norm(v)===norm(val)?'correct':''} ${s.checked&&s.chosen===i&&norm(v)!==norm(val)?'wrong':''}" onclick="pick(${i})" ${s.checked?'disabled':''}>${esc(v)}</button>`}).join('')}</div>`}let a=type==='grammar'?q.a:type==='sentence'?q.fr:s.mode==='choose'?q.nl:q.fr;let french=type==='sentence'||type==='grammar'?null:q.fr;return panel(`<div class="row"><span class="tag">${esc(title)}</span><span class="small muted">${s.idx+1} van ${s.queue.length}</span></div><div class="progressbar"><span style="width:${100*s.idx/s.queue.length}%"></span></div><h2 class="bigword">${esc(prompt)}</h2>${french?`<button class="speaker" onclick="speak(s.queue[s.idx].fr)">🔊 ${s.mode==='listen'?'Luister naar de vraag':'Luister naar het Frans'}</button>`:''}${type==='grammar'?`<div class="small muted">${esc(q.topic)}</div>`:''}<div class="divider"></div>${answerBlock}<div class="controls">${!s.checked?`<button class="btn" onclick="showHint()">💡 Hint</button><button class="btn primary" onclick="checkAnswer()">Controleer ✓</button>`:`<button class="btn primary" onclick="nextQ()">${s.idx===s.queue.length-1?'Bekijk resultaat':'Volgende vraag →'}</button>`}<button class="btn" onclick="nav('practice')">Stoppen</button></div>${s.hintShown&&!s.checked?`<div class="notice">${esc(type==='grammar'?'Denk aan de regel die bij dit onderwerp hoort.':type==='sentence'?'Begin met het onderwerp of de vraagwoorden.':s.mode==='type'?'Het begint met: '+q.fr.slice(0,Math.min(3,q.fr.length))+'…':'Luister nog eens naar de uitspraak.')}</div>`:''}${s.checked?`<div class="feedback ${s.wrongOnce?'error':''}">${s.wrongOnce?'💪 Goed geprobeerd! Het juiste antwoord is:':'⭐ Heel goed gedaan!'} <b>${esc(a)}</b>${type==='grammar'?`<p>${esc(q.why)}</p>`:''}${type==='sentence'?`<p><button class="speaker" onclick="speak(s.queue[s.idx].fr)">🔊 Hoor de volledige zin</button></p>`:''}</div>`:''}${s.wrongOnce&&!s.checked?`<div class="notice">Nog niet juist. Je mag opnieuw proberen, of op <b>Toon antwoord</b> klikken. <button class="btn" onclick="reveal()">Toon antwoord</button></div>`:''}`)}
function pick(i){if(s.checked)return;s.chosen=i;render()}function addPlaced(id){if(s.checked||s.placed.includes(id))return;s.placed.push(id);render()}function removePlaced(i){if(s.checked)return;s.placed.splice(i,1);render()}function showHint(){s.hintShown=!s.hintShown;render()}
function register(q,right){let old=s.mastery[q.id]||{right:0,wrong:0};s.mastery[q.id]={right:old.right+(right?1:0),wrong:old.wrong+(right?0:1),last:Date.now()};save()}
function checkAnswer(){if(s.checked)return;let q=s.queue[s.idx];let submitted=q.kind==='sentence'?s.placed.map(i=>s.wordBank.find(x=>x.id===i).v).join(' '):q.kind==='word'&&s.mode==='type'?(el('answer')?.value||s.lastAnswer):(s.chosen===null?'':s.options[s.chosen]);if(!submitted.trim()){alert('Kies of schrijf eerst een antwoord.');return}let desired=q.kind==='grammar'?q.a:q.kind==='sentence'?q.fr:s.mode==='choose'?q.nl:q.fr;let right=norm(submitted)===norm(desired);if(!right&&!s.wrongOnce&&s.help){s.wrongOnce=true;s.lastAnswer=submitted;s.hintShown=false;register(q,false);render();return}finishAnswer(right)}
function finishAnswer(right){let q=s.queue[s.idx];if(!s.wrongOnce||right)register(q,right);s.checked=true;s.corrects+=right?1:0;s.attempts++;render()}
function reveal(){if(s.checked)return;if(!s.wrongOnce){register(s.queue[s.idx],false);s.wrongOnce=true}finishAnswer(false)}function nextQ(){s.idx++;if(s.idx>=s.queue.length){s.log=[{date:Date.now(),mission:s.mission,kind:s.queue[0]?.kind||'word',right:s.corrects,total:s.queue.length},...s.log].slice(0,120);save();render()}else{prepareQuestion();render()}}
function done(){return panel(`<h2>🎉 Super, Leene!</h2><div class="bigword">${s.corrects} / ${s.queue.length} ⭐</div><p>Je hebt ${s.queue.length} vragen geoefend. Je mag trots zijn dat je het geprobeerd hebt!</p><p class="muted small">Ook als iets moeilijk was: door opnieuw te oefenen leer je bij.</p><div class="controls"><button class="btn primary" onclick="nav('practice')">Nieuwe oefening</button><button class="btn" onclick="nav('progress')">Mijn vooruitgang</button></div>`)}
function words(){let t=currentTopic();return panel(`<h2>🔊 Woordjes leren</h2><p class="muted">Luister, kijk, onthoud. Klik op de kaart om de vertaling te tonen.</p><div class="controls"><select aria-label="Kies onderwerp" onchange="setTopic(this.value)">${DATA.flatMap(m=>m.topics.filter(allowed).map(t=>`<option value="${t.id}" ${s.topic===t.id?'selected':''}>${esc(m.title)} · ${esc(t.name)}</option>`)).join('')}</select></div><div class="grid"><button class="tile" onclick="s.flashIndex=0;s.flashFlip=false;s.page='flash';render()"><span class="sticker">🃏</span><h3>Flitskaartjes</h3><span class="small muted">Leer de woorden één voor één</span></button><button class="tile" onclick="s.mission=groupForTopic(s.topic);s.mode='choose';nav('practice')"><span class="sticker">🎮</span><h3>Oefenen</h3><span class="small muted">Test jezelf op dit onderwerp</span></button></div><div class="divider"></div>${t.items.map(x=>`<div class="wordrow"><div><b>${esc(x[0])}</b><div class="muted">${esc(x[1])}</div></div><button class="speaker" onclick="speak(${JSON.stringify(x[0]).replace(/"/g,'&quot;')})">🔊</button></div>`).join('')}`)}
function flash(){let t=currentTopic(),x=t.items[s.flashIndex%t.items.length];return panel(`<div class="row"><h2>🃏 Flitskaartjes</h2><span class="muted small">${s.flashIndex+1} / ${t.items.length}</span></div><p class="muted">${esc(t.name)}</p><div class="panel" style="text-align:center;min-height:220px;background:#f6f8fe"><div class="bigword">${esc(s.flashFlip?x[1]:x[0])}</div><p class="muted">${s.flashFlip?'Nederlands':'Frans'}</p>${!s.flashFlip?`<button class="speaker" onclick="speak(getT(s.topic).items[s.flashIndex%getT(s.topic).items.length][0])">🔊 Luister</button>`:''}</div><div class="controls"><button class="btn" onclick="s.flashFlip=!s.flashFlip;render()">🔁 Draai kaart om</button><button class="btn primary" onclick="s.flashIndex=(s.flashIndex+1)%getT(s.topic).items.length;s.flashFlip=false;render()">Volgend kaartje →</button><button class="btn" onclick="nav('words')">Terug</button></div>`)}
function grammar(){let m=getM(s.mission);let rules={m1:[['Persoonlijke voornaamwoorden','je = ik, tu = jij, il = hij, elle = zij, nous = wij, vous = jullie/u, ils/elles = zij.'],['Être (zijn)','je suis · tu es · il/elle est · nous sommes · vous êtes · ils/elles sont.']],school:[['Onbepaald lidwoord','un bij mannelijk enkelvoud, une bij vrouwelijk enkelvoud, des bij meervoud.'],['Meervoud','Vaak voeg je -s toe: un cahier → des cahiers.']],m3:[['Bepaald lidwoord','le (m), la (v), l’ voor een klinker en les voor meervoud.'],['À + lidwoord','à + le = au, à + la = à la, à + l’ = à l’, à + les = aux.'],['Aimer en regelmatige -ER','j’aime · tu aimes · il aime · nous aimons · vous aimez · ils aiment.']],m4:[['Bijvoeglijk naamwoord','Een kleur volgt meestal het kledingwoord. Bij vrouwelijk enkelvoud vaak +e: vert → verte.'],['Deze / dit','ce (m), cet (m vóór klinker), cette (v), ces (meervoud).'],['Avoir (hebben)','j’ai · tu as · il/elle a · nous avons · vous avez · ils/elles ont.']]};return panel(`<h2>📗 Grammatica</h2><p class="muted">Een klein geheugensteuntje, daarna oefenen. Enkel de leerstof die Leene al heeft gezien.</p><div class="controls">${DATA.map(mm=>`<button class="btn ${mm.id===m.id?'primary':''}" onclick="s.mission='${mm.id}';save();render()">${esc(mm.title)}</button>`).join('')}</div>${m.id==='m4'&&!s.grammarM4All?`<div class="notice">🔒 De grammaticaoefeningen van Mission 4 staan voorlopig uit omdat Leene deze Mission nog in de klas ziet. Je kunt ze in de Ouderhoek vrijgeven.</div>`:''}<div class="group">${rules[m.id].map(x=>`<div class="wordrow" style="display:block"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></div>`).join('')}</div><button class="btn primary" onclick="startGrammar()" ${m.id==='m4'&&!s.grammarM4All?'disabled':''}>Start grammaticaoefeningen →</button><p class="small muted">Voorbeeldzinnen zijn nieuw samengesteld uit de aangeleverde leerstof; dit is geen digitale kopie van het werkboek.</p>`)}
function progress(){let items=allItems(),tried=items.filter(x=>s.mastery[x.id]),known=tried.filter(x=>s.mastery[x.id].right>=2&&s.mastery[x.id].right>s.mastery[x.id].wrong),weak=tried.filter(x=>s.mastery[x.id].wrong>0&&s.mastery[x.id].wrong>=s.mastery[x.id].right),count=s.log.reduce((n,l)=>n+l.total,0);return panel(`<h2>⭐ Mijn vooruitgang</h2><div class="grid"><div class="stat"><b>${tried.length}</b><div>woordjes/zinnen geprobeerd</div></div><div class="stat"><b>${known.length}</b><div>goed geoefend 🌟</div></div><div class="stat"><b>${weak.length}</b><div>nog eens herhalen</div></div><div class="stat"><b>${count}</b><div>vragen in afgeronde oefenbeurten</div></div></div><p class="small muted">Een woord geldt als goed geoefend na minstens twee juiste antwoorden en meer juiste dan foute antwoorden.</p><div class="divider"></div><h3>💪 Nog eens proberen</h3>${weak.length?weak.slice(0,18).map(x=>`<div class="wordrow"><b>${esc(x.fr)}</b><span class="muted">${esc(x.nl)}</span></div>`).join(''):'Er zijn nog geen moeilijke woorden. Begin met een oefening!'}<div class="controls"><button class="btn primary" onclick="openReview()" ${weak.length?'':'disabled'}>Oefen deze woorden opnieuw</button></div><div class="divider"></div><h3>Mijn laatste oefenbeurten</h3>${s.log.length?s.log.slice(0,10).map(l=>`<div class="wordrow"><span>${new Date(l.date).toLocaleDateString('nl-BE')} · ${esc(getM(l.mission).title)}</span><b>${l.right}/${l.total}</b></div>`).join(''):'Nog geen oefenbeurten afgerond.'}`)}
function changeSetting(k,val){s[k]=val;save();render()}function changeActive(id,v){s.active[id]=v;save();render()}function exportData(){let payload=JSON.stringify({app:'Leene leert Frans',version:3,savedAt:new Date().toISOString(),data:{mission:s.mission,topic:s.topic,size:s.size,large:s.large,spacing:s.spacing,calm:s.calm,active:s.active,mastery:s.mastery,log:s.log,help:s.help,showTranslation:s.showTranslation,reviewErrors:s.reviewErrors,grammarM4All:s.grammarM4All}},null,2);let blob=new Blob([payload],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leene-frans-voortgang.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(input){let f=input.files?.[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let v=JSON.parse(r.result);if(v.app!=='Leene leert Frans'||!v.data?.mastery)throw Error('invalid');let d=v.data;s={...s,...d,active:{...s.active,...d.active},queue:[],page:'parent'};save();render();alert('De oefenresultaten zijn ingelezen.')}catch(e){alert('Dit is geen geldig voortgangsbestand van Leene leert Frans.')}};r.readAsText(f)}
function parent(){return panel(`<h2>⚙️ Ouderhoek</h2><p class="muted">Hier bepaal je welke leerstof Leene ziet en hoeveel ondersteuning ze krijgt. Deze instellingen zijn niet met een wachtwoord beveiligd.</p><h3>Rustig en overzichtelijk leren</h3><div class="switchlist">${[['large','Grotere letters'],['spacing','Meer ruimte tussen letters en regels'],['calm','Rustige, zachte achtergrond'],['help','Bij een fout eerst opnieuw mogen proberen'],['reviewErrors','Moeilijke woorden eerst aanbieden']].map(x=>`<label class="setting"><input type="checkbox" ${s[x[0]]?'checked':''} onchange="changeSetting('${x[0]}',this.checked)">${esc(x[1])}</label>`).join('')}</div><div class="divider"></div><h3>Oefenlengte</h3><select onchange="s.size=Number(this.value);save();render()">${[5,8,10,15].map(x=>`<option value="${x}" ${s.size===x?'selected':''}>${x} vragen per beurt</option>`).join('')}</select><div class="divider"></div><h3>Leerstof vrijgeven</h3><p class="small muted">Mission 1, 2 en 3 zijn in principe afgerond. Bij Mission 4 kun je per onderwerp beslissen wat Leene al heeft gezien.</p>${DATA.map(m=>`<div class="group"><h3>${esc(m.title)} · ${esc(m.subtitle)}</h3><div class="switchlist">${m.topics.map(t=>`<label class="setting"><input type="checkbox" ${allowed(t)?'checked':''} onchange="changeActive('${t.id}',this.checked)">${esc(t.name)}</label>`).join('')}</div></div>`).join('')}<label class="setting"><input type="checkbox" ${s.grammarM4All?'checked':''} onchange="changeSetting('grammarM4All',this.checked)">Grammatica van Mission 4 vrijgeven</label><div class="divider"></div><h3>Bewaar of verhuis de voortgang</h3><p class="small muted">Een back-up is handig als Leene op een ander toestel verder wil oefenen. Het bestand bevat oefenresultaten, maar geen contactgegevens.</p><div class="controls"><button class="btn" onclick="exportData()">⬇️ Download voortgang</button><label class="btn" for="importer">⬆️ Voortgang inladen</label><input type="file" id="importer" accept="application/json,.json" class="hidden" onchange="importData(this)"></div><div class="notice">De voortgang wordt alleen in deze browser bewaard. Als je de browsergegevens wist, kan de voortgang verdwijnen. Maak af en toe een back-up.</div><div class="divider"></div><button class="btn" onclick="if(confirm('Wil je alle opgeslagen oefenresultaten wissen?')){s.mastery={};s.log=[];save();render()}">Wis oefenresultaten</button>`)}
function render(){applySettings();document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('active',b.dataset.page===s.page));let views={home,practice,words,grammar,progress,parent,quiz,flash};el('app').innerHTML=(views[s.page]||home)();if(s.page==='quiz'&&s.mode==='listen'&&!s.checked){/* Audio start bewust alleen na klik van Leene. */}}document.querySelectorAll('#menu button').forEach(b=>b.onclick=()=>nav(b.dataset.page));render();
</script></body></html>
